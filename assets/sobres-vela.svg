    <circle cx="18" cy="42" r="0.9"/>
    <circle cx="22" cy="46" r="0.8"/>
    <circle cx="28" cy="44" r="0.9"/>
    <circle cx="30" cy="50" r="0.8"/>
    <circle cx="20" cy="54" r="0.8"/>
    <circle cx="26" cy="58" r="0.9"/>
    <circle cx="16" cy="60" r="0.7"/>
    <circle cx="32" cy="62" r="0.7"/>
  </g>
  <!-- Cuerda enrollada en la base -->
  <g stroke="#eb5c27" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M10 68 Q14 64 18 68 T26 68 T34 68 T38 68"/>
    <path d="M10 70 Q14 74 18 70 T26 70 T34 70 T38 70"/>
