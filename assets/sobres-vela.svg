<svg viewBox="0 0 48 80" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Rayos de luz -->
  <g stroke="#eb5c27" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="24" y1="2"  x2="24"  y2="10"/>
    <line x1="14" y1="6"  x2="17"  y2="12"/>
    <line x1="34" y1="6"  x2="31"  y2="12"/>
    <line x1="8"  y1="14" x2="13"  y2="16"/>
